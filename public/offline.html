<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zesto — offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: Quicksand, ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(120% 90% at 20% 0%, #201246 0%, #0a0a12 62%);
        color: #EAECF5; text-align: center; padding: 24px;
      }
      .card { max-width: 360px; }
      .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 22px; }
      .logo img { width: 40px; height: auto; }
      .logo span {
        font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em;
        background: linear-gradient(120deg, #9035C0, #4CBDF7);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #A9AEC6; line-height: 1.5; margin: 0 0 20px; }
      a {
        display: inline-block; padding: 12px 20px; border-radius: 999px; text-decoration: none;
        font-weight: 600; color: #fff;
        background: linear-gradient(120deg, #9035C0, #4CBDF7);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <img src="/zesto/zesto-mark.png" alt="" />
        <span>Zesto</span>
      </div>
      <h1>You're offline</h1>
      <p>Your saved recipes, pantry and cooking mode still work. Reconnect for fresh recommendations.</p>
      <a href="/zesto/">Back to Zesto</a>
    </div>
  </body>
</html>
