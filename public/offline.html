<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zesto — offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: Quicksand, ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(120% 90% at 20% 0%, #1a1140 0%, #0B1020 60%);
        color: #EAECF5; text-align: center; padding: 24px;
      }
      .card { max-width: 360px; }
      svg { width: 72px; height: 72px; margin-bottom: 20px; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #A9AEC6; line-height: 1.5; margin: 0 0 20px; }
      a {
        display: inline-block; padding: 12px 20px; border-radius: 999px; text-decoration: none;
        font-weight: 600; color: #0B1020;
        background: linear-gradient(120deg, #9035C0, #4CBDF7);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#141a2e"/>
        <path d="M20 20 H44 L20 44 H44" fill="none" stroke="#fff" stroke-width="8.6"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="44" cy="44" r="5.2" fill="#FDCF00"/>
      </svg>
      <h1>You're offline</h1>
      <p>Your saved recipes, pantry and cooking mode still work. Reconnect to sync and get fresh recommendations.</p>
      <a href="/">Back to Zesto</a>
    </div>
  </body>
</html>
